<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<style>
			html { background: #000; color-scheme: dark; }
			html[data-theme="light"] { background: #fff; color-scheme: light; }
		</style>
		<script>
			try {
				var saved = localStorage.getItem("azpepoze-theme");
				var light = saved ? saved === "light" : matchMedia("(prefers-color-scheme: light)").matches;
				document.documentElement.dataset.theme = light ? "light" : "dark";
			} catch (error) {
				document.documentElement.dataset.theme = "dark";
			}
		</script>

		<title>AzPepoze - My Portfolio & Projects</title>
		<meta
